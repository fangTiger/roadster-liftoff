<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6a3d'/%3E%3Cstop offset='1' stop-color='%23c3122f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 13 L51 47 H13 Z' fill='none' stroke='%23fff' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E"><title>离地 LIFTOFF</title>
<style>
:root{--glass:rgba(14,16,22,.42);--line:rgba(255,255,255,.14);--txt:#f4f6fa;--dim:rgba(244,246,250,.6);--acc:#ff5a3c;--cy:#7fe3ff}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"PingFang SC","SF Pro Display",sans-serif;color:var(--txt)}
canvas{display:block}
.g{position:fixed;background:var(--glass);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#brand{left:18px;top:16px;padding:10px 18px 10px 12px;display:flex;gap:12px;align-items:center}
#brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#ff6a3d,#c3122f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
#brand b{font-size:18px;letter-spacing:3px;display:block}#brand small{font-size:11.5px;color:var(--dim)}
#cams{left:50%;top:16px;transform:translateX(-50%);padding:6px;display:flex;gap:4px}

#cams span.on{background:linear-gradient(180deg,#ff8a5c,#ff4d3a);color:#fff;font-weight:600}
#tools{right:18px;top:16px;padding:9px 16px;display:flex;gap:20px;font-size:16px;color:var(--dim)}
#launch{left:50%;top:86px;transform:translateX(-50%);padding:10px 22px;text-align:center}

#launch b{font:700 34px "SF Pro Display",-apple-system,sans-serif;letter-spacing:1px}#launch b i{font-style:normal;font-size:16px;color:var(--dim);margin-left:4px}
#gauge{left:18px;bottom:16px;padding:16px 20px;display:flex;gap:22px;align-items:center}
#gauge svg{width:112px;height:112px}
#gauge .rows{font-size:13px;color:var(--dim);display:grid;grid-template-columns:auto auto;gap:6px 22px}
#gauge .rows b{color:var(--txt);font-weight:600;text-align:right}
#fuel{display:inline-block;width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);vertical-align:middle;margin-right:6px;position:relative}
#fuel i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#3fb6ff,#9ff0ff)}
#bag{right:18px;bottom:16px;padding:14px 18px;width:250px}
#bag .top{display:flex;justify-content:space-between;align-items:flex-end}
#bag .n{font-size:28px;color:var(--cy);font-weight:600}#bag .n small{font-size:13px;color:var(--dim);margin-left:6px;font-weight:400}
#bag .ach{text-align:right;font-size:12px;color:var(--dim)}#bag .ach b{display:block;color:var(--txt);font-size:15px}
#bag .time{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px}
#bag .bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);position:relative}
#bag .bar i{position:absolute;left:0;top:0;bottom:0;width:72%;border-radius:2px;background:linear-gradient(90deg,#ff9a5c,#ffd2a0)}
#keys{left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;display:flex;gap:14px;font-size:12.5px;color:var(--dim);white-space:nowrap}
@media (max-width:1480px){#keys{gap:10px;font-size:12px;padding:7px 12px}#keys span:nth-child(n+6){display:none}}
@media (max-width:1180px){#keys{display:none}}
kbd{display:inline-block;min-width:18px;padding:1px 5px;margin-right:4px;border-radius:5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--txt);font:600 11px -apple-system,sans-serif;text-align:center}
#credit{right:18px;bottom:150px;padding:7px 12px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim)}
#credit .dot{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px var(--cy)}#credit b{color:var(--txt);font-weight:600}
#toast{right:18px;top:78px;padding:10px 16px 10px 12px;display:flex;gap:12px;align-items:center}
#toast .ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#7fe3ff,#2f7cff);display:flex;align-items:center;justify-content:center;font-size:17px}
#toast b{display:block;font-size:14.5px}#toast small{font-size:12px;color:var(--dim)}
.speed{position:fixed;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,.0) 0deg,rgba(255,255,255,.0) 2.6deg,rgba(255,255,255,.07) 2.8deg,rgba(255,255,255,0) 3deg);-webkit-mask:radial-gradient(ellipse at 50% 52%,transparent 38%,#000 75%);mask:radial-gradient(ellipse at 50% 52%,transparent 38%,#000 75%)}
</style><link rel="stylesheet" href="/src/ui/ui.css"><link rel="stylesheet" href="/src/mobile/mobile.css"></head><body>

</div>
<div class="g" id="keys"><span><kbd>W</kbd>加速</span><span><kbd>S</kbd>刹车</span><span><kbd>A</kbd><kbd>D</kbd>转向</span><span><kbd>空格</kbd>推进器</span><span>按住<kbd>空格</kbd>冲出大气层</span><span><kbd>R</kbd>翻滚</span><span><kbd>C</kbd>镜头</span><span><kbd>H</kbd>喇叭</span></div>
<div class="g" id="credit"><span class="dot"></span>Built with <b>Arc Studio</b> + <b>Claude Code</b></div>
<div class="g" id="bag"><div class="top"><div class="n"><span id="hops">0</span><small>次离地</small></div><div class="ach">成就<b>0 / 19</b></div></div>
